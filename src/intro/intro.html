<!-- ===== "Before we start" intro deck (Use cases tab) =====
     Reuses the .pgr-story CSS of the survey story; extra components are scoped to .pgr-intro.
     Slide 4 holds [data-plan], which app.js fills with the group/discipline table (stored with the facilitator).
     Keys while visible: ←/→ or PageUp/PageDown, N = talk track, F = full screen. -->
<div class="pgr-story pgr-intro" data-pgr-intro data-theme="light" lang="en" aria-label="Before we start: introduction slides"></div>
<style>
.pgr-intro{margin-bottom:22px}
.pgr-intro .ps-stage{min-height:700px}
.pgr-intro .ps-slide{overflow-y:auto}
/* 1 · about me */
.pgr-intro .pi-me{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:28px;align-items:center}
.pgr-intro .pi-photo{margin:0;position:relative}
.pgr-intro .pi-photo img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:18px;box-shadow:var(--shadow)}
.pgr-intro .pi-photo figcaption{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.35}
.pgr-intro .pi-photo figcaption b{display:block;color:var(--ink);font-size:15px}
.pgr-intro .pi-hats{display:grid;gap:10px}
.pgr-intro .pi-hat{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px}
.pgr-intro .pi-hat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--cs);color:var(--c)}
.pgr-intro .pi-hat .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:650}
.pgr-intro .pi-hat .t{font-weight:650;font-size:16px;line-height:1.25}
.pgr-intro .pi-hat .s{font-size:13px;color:var(--muted)}
/* session flow */
.pgr-intro .pi-flow{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1.25fr) 34px minmax(0,1fr);align-items:stretch}
.pgr-intro .pi-arw{display:grid;place-items:center;color:var(--faint);font-size:26px}
.pgr-intro .pi-st{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;border-block-start:5px solid var(--c)}
.pgr-intro .pi-st .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--cs);color:var(--c)}
.pgr-intro .pi-st .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:650}
.pgr-intro .pi-st .t{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.15}
.pgr-intro .pi-st .p{font-size:14px;color:var(--muted);line-height:1.35}
.pgr-intro .pi-lv{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.pgr-intro .pi-lv span{font-size:12.5px;font-weight:600;border-radius:99px;padding:4px 10px;background:var(--soft);color:var(--ink)}
.pgr-intro .pi-lv span b{color:var(--accent)}
.pgr-intro .pi-lv span.o{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.pgr-intro .pi-aux{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pgr-intro .pi-ax{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;border:1px dashed var(--line);border-radius:14px;padding:10px 14px}
.pgr-intro .pi-ax .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--ink)}
.pgr-intro .pi-ax b{display:block;font-size:15px}
.pgr-intro .pi-ax span{font-size:13px;color:var(--muted)}
.pgr-intro .pi-auxl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:650;margin-bottom:-8px}
/* 2 · chat, cowork, agent */
.pgr-intro .pi-modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pgr-intro .pi-mode{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;border-block-start:5px solid var(--c)}
.pgr-intro .pi-mode svg{width:100%;height:118px;display:block}
.pgr-intro .pi-mode .t{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.1}
.pgr-intro .pi-mode .p{font-size:14px;color:var(--muted);line-height:1.35}
.pgr-intro .pi-mode .tag{align-self:flex-start;font-size:11.5px;font-weight:600;color:var(--c);background:var(--cs);border-radius:99px;padding:3px 10px;margin-top:2px}
.pgr-intro .pi-auto{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:-6px}
.pgr-intro .pi-auto i{height:4px;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--ochre),var(--accent));position:relative}
.pgr-intro .pi-auto i::after{content:'';position:absolute;right:-2px;top:50%;width:10px;height:10px;border-top:4px solid var(--accent);border-right:4px solid var(--accent);transform:translateY(-50%) rotate(45deg)}
.pgr-intro .pi-eq{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pgr-intro .pi-eq .lb{align-self:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:650;width:100%;margin-bottom:2px}
.pgr-intro .pi-eq .op{align-self:center;font-family:var(--serif);font-size:24px;color:var(--faint);padding:0 2px}
.pgr-intro .pi-chip{flex:1 1 140px;border-radius:12px;padding:8px 12px;background:var(--cs);border-inline-start:4px solid var(--c)}
.pgr-intro .pi-chip b{display:block;font-size:15px;color:var(--ink)}
.pgr-intro .pi-chip span{font-size:12.5px;color:var(--muted)}
.pgr-intro .pi-chip.res{background:var(--ink);border-color:var(--accent)}
.pgr-intro .pi-chip.res b{color:var(--paper)}
.pgr-intro .pi-chip.res span{color:var(--paper);opacity:.75}
/* 3 · traps */
.pgr-intro .pi-traps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pgr-intro .pi-trap{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.pgr-intro .pi-trap .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.pgr-intro .pi-trap .n{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:650}
.pgr-intro .pi-trap .t{font-weight:650;font-size:17px;line-height:1.2;margin:1px 0 4px}
.pgr-intro .pi-trap .p{font-size:14px;color:var(--muted);line-height:1.35}
.pgr-intro .pi-trap .g{font-size:13.5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pgr-intro .pi-trap .g b{color:var(--verify)}
/* 4 · groups (table filled by app.js) */
.pgr-intro .pi-plan{padding:14px 16px}
.pgr-intro .pi-plan .hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.pgr-intro .pi-plan h4{margin:0}
.pgr-intro .pi-tbl{width:100%;border-collapse:collapse;font-size:14px}
.pgr-intro .pi-tbl th{text-align:start;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:650;padding:6px 8px;border-bottom:1px solid var(--line)}
.pgr-intro .pi-tbl td{padding:4px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.pgr-intro .pi-tbl td:first-child{font-weight:650;white-space:nowrap}
.pgr-intro .pi-tbl td:nth-child(2){width:58%}
.pgr-intro .pi-tbl code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;background:var(--soft);border-radius:6px;padding:2px 7px;white-space:nowrap}
.pgr-intro .pi-tbl input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.pgr-intro .pi-tbl input:focus{outline:2px solid var(--accent);outline-offset:1px}
.pgr-intro .pi-tbl tr.me td{background:var(--accent-soft)}
.pgr-intro .pi-tbl .em{color:var(--faint)}
.pgr-intro .pi-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;align-items:start}
.pgr-intro .pi-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.pgr-intro .pi-me,.pgr-intro .pi-modes,.pgr-intro .pi-traps,.pgr-intro .pi-flow,.pgr-intro .pi-aux{grid-template-columns:1fr}.pgr-intro .pi-arw{transform:rotate(90deg);height:30px}.pgr-intro .pi-me{gap:16px}.pgr-intro .pi-photo{max-width:260px}.pgr-intro .ps-stage{min-height:980px}.pgr-intro .pi-split{grid-template-columns:1fr}}
</style>

var S = [];
S.push({t:'About me', note:'I am Manuel. I wear three hats today: professor at Heilbronn University of Applied Sciences, where I research and teach AI in marketing and relationship management; consultant at Hitachi Solutions, where we bring Copilot and agents into organisations; and, a few years ago, a doctoral researcher in the UK myself. So I know both sides: what the technology can do, and what it feels like to defend your work in a viva.',

S.push({t:'How this session works', note:'Here is how the next hour and a half works – I will show it in the tool in a minute. Step 1: your group rates the use cases for your research: how valuable, what kind of gain, how feasible. Step 2: you pick one to three of your best-rated use cases and try them live with Copilot. Each one comes with a starter prompt and a check, and you can climb three levels: chat, notebook, agent. Results shows what the whole room rated and tested. On the side you have practice data – papers and raw datasets you can use instead of your own unpublished material – and Academic Extensions & Tools for specialist tools beyond Copilot. Before we start: what actually changes when you go from chat to agent?',

S.push({t:'Chat, notebook, agent', note:'Three ways to work with AI. In a chat you ask, it answers – you steer every single step. In the middle, cowork or a notebook: it works with you on your files and keeps them together – Copilot Cowork works through a multi-step task, a Copilot notebook keeps your sources and answers in one place – and you check each step. An agent pursues a goal on its own: it plans, acts and checks in a loop. The more autonomy, the more it needs: a clear goal, the right context – instructions, your files, memory – and tools such as search, code or a connector to a database. A chat alone has none of that. That is also the ladder in Step 2: Chat, then a notebook adds context, an agent adds standing instructions, Copilot Studio or your own code on GitHub adds tools.',

/* ---------- engine (same behaviour as the survey story) ---------- */
function init(root){
  if(!root || root.__pgr) return; root.__pgr = true;
  root.innerHTML =
   '<div class="ps-top"><span class="ps-brand"><b>Before we start</b> · Where does AI actually help me?</span><span class="ps-chapter" aria-live="polite"></span></div>'+
   '<div class="ps-progress"><i></i></div><div class="ps-stage"><div class="ps-scale">'+S.map(function(s,i){return '<section class="ps-slide" data-i="'+i+'" aria-roledescription="slide" aria-label="'+(i+1)+' of '+S.length+': '+esc(s.t)+'">'+s.html+'</section>';}).join('')+'</div></div>'+
   '<div class="ps-notes" role="note"><div class="nh">Talk track</div><div class="nt"></div></div>'+
   '<nav class="ps-nav" aria-label="Intro navigation"><button type="button" class="ps-btn" data-act="prev">← Back</button><div class="ps-dots">'+S.map(function(s,i){return '<button type="button" data-go="'+i+'" aria-label="Go to '+(i+1)+': '+esc(s.t)+'"></button>';}).join('')+'</div>'+
   '<button type="button" class="ps-btn" data-act="notes" aria-pressed="false" title="Talk track (N)">Notes</button><button type="button" class="ps-btn" data-act="fs" title="Full screen (F)">⛶</button><button type="button" class="ps-btn pri" data-act="next">Next →</button></nav>';
  var slides = root.querySelectorAll('.ps-slide'), dots = root.querySelectorAll('.ps-dots button'), cur = -1, visible = false;
  function go(i){
    i = Math.max(0, Math.min(S.length-1, i)); if(i===cur) return;
    slides.forEach(function(sl,k){ sl.classList.toggle('is-on',k===i); sl.classList.toggle('is-prev',k<i); sl.setAttribute('aria-hidden', k===i?'false':'true'); if('inert' in sl) sl.inert = k!==i; });
    if(root.classList.contains('is-fit')) fit();
    dots.forEach(function(d,k){ if(k===i) d.setAttribute('aria-current','step'); else d.removeAttribute('aria-current'); });
    root.querySelector('.ps-chapter').textContent = (i+1)+' / '+S.length+' · '+S[i].t;
    root.querySelector('.ps-progress i').style.width = (100*(i+1)/S.length)+'%';
    root.querySelector('[data-act="prev"]').disabled = i===0;
    root.querySelector('[data-act="next"]').disabled = i===S.length-1;
    root.querySelector('.ps-notes .nt').textContent = S[i].note || '';
    cur = i; slides[i].scrollTop = 0;
  }
  root.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b || !root.contains(b) || b.closest('[data-plan]')) return;
    var a = b.getAttribute('data-act');
    if(a==='next') go(cur+1); else if(a==='prev') go(cur-1);
    else if(a==='notes'){ var on = root.classList.toggle('show-notes'); b.setAttribute('aria-pressed', on); }
    else if(a==='fs'){ if(document.fullscreenElement) document.exitFullscreen(); else if(root.requestFullscreen) root.requestFullscreen(); }
    else if(b.hasAttribute('data-go')) go(+b.getAttribute('data-go'));
  });
  document.addEventListener('keydown', function(e){
    if(!visible || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var tg = e.target; if(tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))) return;
    if(tg && tg !== document.body && !root.contains(tg) && !document.fullscreenElement) return;
    if(document.fullscreenElement && document.fullscreenElement !== root) return;
    var k = e.key;
    if(k==='ArrowRight'||k==='PageDown'){ go(cur+1); e.preventDefault(); }
    else if(k==='ArrowLeft'||k==='PageUp'){ go(cur-1); e.preventDefault(); }
    else if(k==='Home'){ go(0); e.preventDefault(); } else if(k==='End'){ go(S.length-1); e.preventDefault(); }
    else if(k==='n'||k==='N'){ root.querySelector('[data-act="notes"]').click(); }
    else if(k==='f'||k==='F'){ root.querySelector('[data-act="fs"]').click(); }
  });
  if('IntersectionObserver' in window){ new IntersectionObserver(function(en){ visible = en[0].isIntersecting; },{threshold:.4}).observe(root); }
  function fit(){
    var st = root.querySelector('.ps-stage'), sc = st.firstElementChild, on = document.fullscreenElement === root && window.innerWidth > 900;
    root.classList.toggle('is-fit', on);
    if(!on){ sc.style.width = sc.style.height = sc.style.transform = ''; root.style.removeProperty('--fz'); return; }
    root.style.setProperty('--fz', Math.max(1, Math.min(window.innerWidth/1280, window.innerHeight/830)).toFixed(3));
    var W = st.clientWidth, H = st.clientHeight, k = Math.min(W/1280, H/720), sl = root.querySelector('.ps-slide.is-on');
    for(var n = 0; n < 3; n++){
      sc.style.width = (W/k) + 'px'; sc.style.height = (H/k) + 'px'; sc.style.transform = 'scale(' + k + ')';
      if(!sl || sl.scrollHeight <= sl.clientHeight + 1) break;
      k = H / sl.scrollHeight;
    }
  }
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', function(){ fit(); setTimeout(fit, 200); });
  go(0);
  document.dispatchEvent(new Event('pgr-intro-ready'));
}
window.PgrIntro = { init: init, slides: S };
function boot(){ document.querySelectorAll('[data-pgr-intro]').forEach(init); }
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
